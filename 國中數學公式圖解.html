<style>

:root[data-theme="dark"]{
  --bg:#15171b;--card:#1d2026;--plot:#191c21;--soft:#252932;--ink:#e8e9ec;--mute:#a1a7b3;--line:#333844;--grid:#262a32;--axis:#6f7684;

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
header{max-width:1200px;margin:0 auto;padding:32px 16px 12px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 6px;letter-spacing:.02em}
.sub{color:var(--mute);margin:0;max-width:46em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:15px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px}
main{max-width:1200px;margin:0 auto;padding:0 16px 48px}
.grade>h2{font-size:26px;margin:36px 0 2px}
.grade>h2 small{font-size:15px;color:var(--mute);font-weight:400;margin-left:8px}
.chap>h3{font-size:18px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{margin:0;font-size:18px}
.fml{overflow-x:auto;overflow-y:hidden;padding:2px 0;font-size:1.02em}
.fml .katex-display{margin:.3em 0}
svg.viz{width:100%;height:auto;display:block;background:var(--plot);border-radius:10px;border:1px solid var(--grid);user-select:none;-webkit-user-select:none}
.ctl{display:grid;gap:2px}
.sl{display:grid;grid-template-columns:minmax(2.6em,auto) 1fr 3.8em;gap:8px;align-items:center;font-size:14px}
.sl input{width:100%;accent-color:var(--c1);margin:6px 0}
.val{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.btns button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.btns button.on{border-color:var(--c1);color:var(--c1);font-weight:700}
.tx{white-space:normal}
.tx i{font-family:"Times New Roman",Cambria,"Noto Serif",serif;font-size:1.1em;padding-right:.04em}
.tx sup,.tx sub{font-size:.72em;line-height:0}
.tx .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.2}
.tx .fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em}
.tx .ov{border-top:1px solid currentColor;padding-top:.05em}
.tx .vc{position:relative;display:inline-block}.tx .vc::before{content:'→';position:absolute;left:0;right:0;top:-.9em;font-size:.7em;text-align:center}
.tx .mat{display:inline-grid;column-gap:.6em;vertical-align:middle;padding:0 .4em;margin:0 .15em;border-left:1.5px solid;border-right:1.5px solid;text-align:center;line-height:1.35}
.tx .mat.pmatrix{border-radius:.7em}
.tx .cases{display:inline-flex;flex-direction:column;vertical-align:middle;border-left:1.5px solid;border-radius:.6em 0 0 .6em;padding-left:.45em;text-align:left;line-height:1.6}
.tx .rows{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:2}
.tx .xa{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .2em}.tx .xa>span{font-size:.7em}
.tx .op{margin-right:.15em}
.tx .tt{font-style:normal}
.tx.disp{display:block;text-align:center;font-size:1.12em;line-height:2;padding:.2em 0}
.out{font-size:14px;background:var(--soft);border-radius:8px;padding:8px 10px;overflow-x:auto;line-height:1.9}
.plain{font-size:14.5px;margin:0}
.plain b{color:var(--c1)}
.hint{font-size:12.5px;color:var(--mute);margin:-4px 0 0}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--plot);border:1px solid var(--grid);border-radius:10px;padding:14px 8px;min-height:90px}
.slot{width:46px;text-align:center;border:2px solid var(--c1);border-radius:8px;padding:4px 0;background:var(--c1a)}
.slot b{display:block;font-size:20px}
.slot small{font-size:11px;color:var(--mute)}
.stars{font-size:22px;letter-spacing:2px;word-break:break-all;text-align:center}
.stars .bar1{color:var(--ink);font-weight:700;padding:0 3px}
.counts{font-size:13px;color:var(--mute);text-align:center;width:100%}
footer{max-width:1200px;margin:0 auto;padding:16px 16px 40px;color:var(--mute);font-size:14px}
footer a{color:var(--c1)}
.xl{margin:0 0 8px;font-size:14px}
.xl a{color:var(--c1);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px}
/* SVG */
.grid-l{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1.2}
.num{fill:var(--mute);font-size:9px;text-anchor:middle;dominant-baseline:middle}
.k0{stroke:var(--ink);stroke-width:2;fill:none}
.k1{stroke:var(--c1);stroke-width:2.6;fill:none}
.k2{stroke:var(--c2);stroke-width:2.6;fill:none}
.k3{stroke:var(--c3);stroke-width:2.6;fill:none}
.k4{stroke:var(--c4);stroke-width:2.6;fill:none}
.k5{stroke:var(--c5);stroke-width:2.6;fill:none}
.km{stroke:var(--mute);stroke-width:1.4;fill:none}
.thin{stroke-width:1.4}
.fat{stroke-width:4.5}
.dash{stroke-dasharray:5 4}
.f1{fill:var(--c1a);stroke:var(--c1);stroke-width:1.4}
.f2{fill:var(--c2a);stroke:var(--c2);stroke-width:1.4}
.f3{fill:var(--c3a);stroke:var(--c3);stroke-width:1.4}
.f4{fill:var(--c4a);stroke:var(--c4);stroke-width:1.4}
.f5{fill:var(--c5a);stroke:var(--c5);stroke-width:1.4}
.fs1{fill:var(--c1);opacity:.55;stroke:var(--c1)}
.fs2{fill:var(--c2);opacity:.55;stroke:var(--c2)}
.fg{fill:var(--grid);stroke:var(--axis);stroke-width:1}
.fn{fill:none}
.d0{fill:var(--ink)}.d1{fill:var(--c1)}.d2{fill:var(--c2)}.d3{fill:var(--c3)}.d4{fill:var(--c4)}.d5{fill:var(--c5)}.dm{fill:var(--mute)}
.t{fill:var(--ink);font-size:12px;dominant-baseline:middle}
.tm{fill:var(--mute);font-size:11px;dominant-baseline:middle}
.t1{fill:var(--c1)}.t2{fill:var(--c2)}.t3{fill:var(--c3)}.t4{fill:var(--c4)}
.mid{text-anchor:middle}.end{text-anchor:end}
.b{font-weight:700}
.sm{font-size:10px}
.handle{fill:var(--card);stroke-width:3;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
.h1{stroke:var(--c1)}.h2{stroke:var(--c2)}.h3{stroke:var(--c3)}.h0{stroke:var(--ink)}

</footer>

<script>

function txSplit(str,sep){const out=[];let d=0,last=0;
  for(let k=0;k<str.length;){

    if(str.startsWith('\\begin',k)){d++;k+=6;continue;}
    if(str.startsWith('\\end',k)){d--;k+=4;continue;}
    if(d===0&&str.startsWith(sep,k)){out.push(str.slice(last,k));k+=sep.length;last=k;continue;}

function tex2html(s){
  let i=0;
  const esc=c=>c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c;
  const sp=()=>{while(s[i]===' ')i++;};
  const cmd=()=>{i++;const m=/^[A-Za-z]+/.exec(s.slice(i));if(m){i+=m[0].length;return m[0];}return s[i++]||'';};
  const raw=()=>{sp();if(s[i]!=='{')return s[i++]||'';let d=1;const j=++i;while(i<s.length&&d){if(s[i]==='\\'){i+=2;continue;}if(s[i]==='{')d++;else if(s[i]==='}')d--;i++;}return s.slice(j,i-1);};

  function findEnd(env){const b='\\begin{'+env+'}',e='\\end{'+env+'}';let d=0,k=i;while(k<s.length){if(s.startsWith(b,k)){d++;k+=b.length;}else if(s.startsWith(e,k)){if(!d)return k;d--;k+=e.length;}else k++;}return s.length;}
  function env(name,body){
    const rows=txSplit(body,'\\\\').filter(r=>r.trim()!=='').map(r=>txSplit(r,'&').map(tex2html));

  function command(n){
    if(n==='\\')return '<br>';
    if(n in TXSYM)return TXSYM[n];

    if(c==='{'){i++;const h=expr('}');i++;return h;}

      else if(a==='−'&&h.trim()&&!/[(\[{+−×÷=,⇒⟺≤≥≈±\u2009\u2003]$|&lt;$|&gt;$|<br>$/.test(h))a='\u2009−\u2009';

const T=(s,disp=false)=>disp&&window.katex?katex.renderToString(s,{throwOnError:false,displayMode:true}):`<span class="tx${disp?' disp':''}">${tex2html(s)}</span>`;

const snap=(v,s=.5)=>Math.round(v/s)*s;

const binom=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);};

function terms(list){let s='';for(const [c0,v] of list){const c=Math.round(c0*100)/100;if(c===0)continue;const a=Math.abs(c);const co=(a===1&&v)?'':fx(a);s+=(s===''?(c<0?'-':''):(c<0?' - ':' + '))+co+v;}return s||'0';}

const par=v=>v<0?`(${fx(v)})`:fx(v);

function Plot(box,o={}){
  const w=o.w||300,xr=o.xr||[-5,5],yr=o.yr||[-4,4];

    E('line',{x1:0,x2:w,y1:Y(0),y2:Y(0),class:'axis'},base);E('line',{x1:X(0),x2:X(0),y1:0,y2:h,class:'axis'},base);

    dot(x,y,c='d0',r=4,p=dyn){return E('circle',{cx:X(x),cy:Y(y),r,class:c},p);},

function Ctl(box){
  const wrap=H('div','ctl',box);
  const U={on(){},
    slider(label,min,max,step,val,fmt=fx){
      const row=H('label','sl',wrap,`<span class="nm">${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><span class="val"></span>`);
      const inp=row.querySelector('input'),sp=row.querySelector('.val');
      const o={get v(){return +inp.value;},set(x){inp.value=x;sp.textContent=fmt(+inp.value);}};
      sp.textContent=fmt(+inp.value);inp.addEventListener('input',()=>{sp.textContent=fmt(+inp.value);U.on();});return o;},
    buttons(list,toggle=false){
      const row=H('div','btns',wrap);
      list.forEach(([lab,fn],i)=>{const b=H('button','',row,lab);b.type='button';if(toggle&&i===0)b.classList.add('on');
        b.addEventListener('click',()=>{if(toggle){row.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}fn();U.on();});});
      return row;},
    out(){return H('div','out',box);}
  };
  return U;
}

    else{const x=(D-B)/(A-Cc),y=A*x+B;P.dot(x,y,'d0',5.5);P.text(x,y,`(${fx(x)}, ${fx(y)})`,'t b',8,-10);s+='交點就是解：'+T(`x=${fx(x)},\\ y=${fx(y)}`);}
    out.innerHTML=s;};
  U.on();}});

C({g:1,ch:'直角坐標與二元一次方程式',t:'正比與反比',tex:'\\text{正比：}\\ y=kx\\qquad \\text{反比：}\\ xy=k\\ \\left(y=\\frac kx\\right)',
d:'<b>正比</b>：x 變 2 倍，y 也變 2 倍，圖形是通過原點的直線（例如買飲料的杯數和總價）。<b>反比</b>：x 變 2 倍，y 反而變一半，兩數相乘固定（例如固定路程時速度和時間）。',
viz(b){const P=Plot(b,{xr:[-.6,8.6],yr:[-.6,8.6],w:280}),U=Ctl(b);let inv=false;
  U.buttons([['正比',()=>{inv=false;}],['反比',()=>{inv=true;}]],true);const k=U.slider('k',.5,4,.5,2),out=U.out();
  U.on=()=>{P.clear();const K=k.v,f=x=>inv?K/x:K*x;P.fn(f,'k1',inv?.05:0,8.6,300);
    const xs=[1,2,3,4];xs.forEach(x=>{const y=f(x);P.dot(x,y,'d2',4);if(inv)P.rect(0,0,x,y,'fn km thin dash');});
    out.innerHTML=`<table style="border-collapse:collapse;width:100%;text-align:center"><tr><td>x</td>${xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><td>y</td>${xs.map(x=>`<td><b>${fx(f(x))}</b></td>`).join('')}</tr></table>`+(inv?`每一組 x × y 都等於 ${K}（虛線長方形面積都一樣）`:`每一組 y ÷ x 都等於 ${K}`);};
  U.on();}});

/* ---------- 國二：乘法公式與多項式 ---------- */
C({g:2,ch:'乘法公式與多項式',t:'和的平方公式',tex:'(a+b)^2=a^2+2ab+b^2',
d:'把邊長 <b>a+b</b> 的正方形切成四塊：一塊 a²、一塊 b²、兩塊 ab。四塊加起來就是整個正方形，所以中間會多出「2ab」。',
viz(b){const P=Plot(b,{xr:[-.6,10.4],yr:[-.6,11.2],w:280,grid:false,axes:false}),U=Ctl(b);
  const a=U.slider('a',1,6,.5,4),bb=U.slider('b',1,4,.5,2.5),out=U.out();
  U.on=()=>{P.clear();const A=a.v,B=bb.v,s=10/(A+B);
    const r=(x,y,w,h,cl,lab)=>{P.rect(x*s,y*s,w*s,h*s,cl);P.text((x+w/2)*s,(y+h/2)*s,lab,'t mid b');};
    r(0,B,A,A,'f1','a²');r(A,B,B,A,'f2','ab');r(0,0,A,B,'f2','ab');r(A,0,B,B,'f3','b²');
    P.text(A*s/2,10,'a','t mid t1',0,-8);P.text((A+B/2)*s,10,'b','t mid t3',0,-8);
    P.text(0,(B+A/2)*s,'a','t mid t1',-8);P.text(0,B/2*s,'b','t mid t3',-8);
    out.innerHTML=T(`(${A}+${B})^2=${fx((A+B)**2)}`)+'<br>'+T(`${A}^2+2\\times${A}\\times${B}+${B}^2=${fx(A*A)}+${fx(2*A*B)}+${fx(B*B)}=${fx((A+B)**2)}`);};
  U.on();}});

C({g:2,ch:'乘法公式與多項式',t:'差的平方公式',tex:'(a-b)^2=a^2-2ab+b^2',
d:'從 a² 的大正方形，切掉上面和右邊兩條 <b>a×b 的長條</b>。但右上角那塊 b² 被切了兩次，所以要<b>加回一次 b²</b>，剩下的就是 (a−b)²。',
viz(b){const P=Plot(b,{xr:[-.6,10.4],yr:[-.6,11.2],w:280,grid:false,axes:false}),U=Ctl(b);
  const a=U.slider('a',3,6,.5,5),bb=U.slider('b',.5,2.5,.5,1.5),out=U.out();
  U.on=()=>{P.clear();const A=a.v,B=bb.v,s=10/A,r=(x,y,w,h,cl)=>P.rect(x*s,y*s,w*s,h*s,cl);
    r(0,0,A,A,'fg');r(0,0,A-B,A-B,'f3');r(0,A-B,A,B,'f2');r(A-B,0,B,A,'f2');r(A-B,A-B,B,B,'f4');
    P.text((A-B)/2*s,(A-B)/2*s,'(a−b)²','t mid b');P.text((A-B)/2*s,(A-B/2)*s,'ab','t mid');P.text((A-B/2)*s,(A-B)/2*s,'ab','t mid');P.text((A-B/2)*s,(A-B/2)*s,'b²','t mid b');
    P.text(A/2*s,10,'a','t mid',0,-8);P.text((A-B)/2*s,0,'a − b','tm mid',0,-8);P.text(A*s,(A-B/2)*s,'b','t',4);
    out.innerHTML=T(`(${A}-${B})^2=${fx((A-B)**2)}`)+'<br>'+T(`${A}^2-2\\times${A}\\times${B}+${B}^2=${fx(A*A)}-${fx(2*A*B)}+${fx(B*B)}=${fx((A-B)**2)}`);};
  U.on();}});

C({g:2,ch:'乘法公式與多項式',t:'平方差公式',tex:'a^2-b^2=(a+b)(a-b)',
d:'從大正方形 a² 挖掉小正方形 b²，剩下的 L 形切成兩塊，<b>重新拼起來</b>剛好是寬 a+b、高 a−b 的長方形。',
viz(b){const P=Plot(b,{xr:[-.4,14.6],yr:[-1,7.2],w:320,grid:false,axes:false}),U=Ctl(b);
  const a=U.slider('a',3,6,.5,5),bb=U.slider('b',.5,2.5,.5,2),out=U.out();
  U.on=()=>{P.clear();const A=a.v,B=bb.v,s=12.4/(2*A+B+1.2),x0=(A+1.2)*s;
    P.rect(0,0,A*s,(A-B)*s,'f1');P.rect(0,(A-B)*s,(A-B)*s,B*s,'f2');P.rect((A-B)*s,(A-B)*s,B*s,B*s,'fg dash');
    P.text((A-B/2)*s,(A-B/2)*s,'b²','tm mid');
    P.text(A*s/2,0,'a','t mid',0,10);
    P.rect(x0,0,A*s,(A-B)*s,'f1');P.rect(x0+A*s,0,B*s,(A-B)*s,'f2');
    P.text(x0+(A+B)/2*s,0,'a + b','t mid',0,10);P.text(x0+(A+B)*s,(A-B)/2*s,'a − b','t',4);
    P.text((A+1.2)*s-.6*s,A*s/2,'⇒','t mid b');
    out.innerHTML=T(`${A}^2-${B}^2=${fx(A*A)}-${fx(B*B)}=${fx(A*A-B*B)}`)+'<br>'+T(`(${A}+${B})(${A}-${B})=${fx(A+B)}\\times${fx(A-B)}=${fx((A+B)*(A-B))}`);};
  U.on();}});

C({g:2,ch:'乘法公式與多項式',t:'十字交乘（因式分解）',tex:'x^2+(a+b)x+ab=(x+a)(x+b)',
d:'用積木排長方形：一塊 <b style="color:var(--c1)">x²</b>、(a+b) 條 <b style="color:var(--c2)">x 長條</b>、ab 個 <b style="color:var(--c3)">小方塊</b>。能排成完整的長方形，長和寬就是兩個因式。所以要找「相乘是常數、相加是 x 的係數」的兩個數。',
viz(b){const P=Plot(b,{xr:[-1,10.2],yr:[-1,10.2],w:280,grid:false,axes:false}),U=Ctl(b);
  const a=U.slider('a',1,5,1,3),bb=U.slider('b',1,5,1,2),out=U.out();const X=4.2;
  U.on=()=>{P.clear();const A=a.v,B=bb.v,top=B+X;
    P.rect(0,B,X,X,'f1');P.text(X/2,B+X/2,'x²','t mid b');
    for(let i=0;i<A;i++){P.rect(X+i,B,1,X,'f2');}for(let j=0;j<B;j++){P.rect(0,j,X,1,'f2');}
    for(let i=0;i<A;i++)for(let j=0;j<B;j++)P.rect(X+i,j,1,1,'f3');
    P.text(X/2,top,'x','t mid',0,-9);P.text(X+A/2,top,`${A}`,'t mid t2 b',0,-9);P.text(0,B+X/2,'x','t',-12);P.text(0,B/2,`${B}`,'t t2 b',-12);
    out.innerHTML=T(`x^2+${A+B}x+${A*B}=(x+${A})(x+${B})`)+`<br>${A} × ${B} = ${A*B}（常數），${A} + ${B} = ${A+B}（x 的係數）`;};
  U.on();}});

/* ---------- 國二：平方根與畢氏定理 ---------- */
C({g:2,ch:'平方根與畢氏定理',t:'平方根',tex:'(\\sqrt{A})^2=A,\\qquad n^2<A<(n+1)^2\\Rightarrow n<\\sqrt A<n+1',
d:'√A 就是「面積是 A 的正方形，<b>邊長是多少</b>」。不是完全平方數時，可以用前後兩個完全平方數，估計它介於哪兩個整數之間。',
viz(b){const P=Plot(b,{xr:[-.4,7.8],yr:[-.4,7.8],w:260}),U=Ctl(b);const A=U.slider('面積 A',1,50,1,20),out=U.out();
  U.on=()=>{P.clear();const v=A.v,s=Math.sqrt(v),n=Math.floor(s+1e-9),exact=n*n===v;
    if(!exact)P.rect(0,0,n+1,n+1,'fn k2 dash thin');P.rect(0,0,s,s,'f1');if(!exact)P.rect(0,0,n,n,'fn k3 dash thin');
    P.text(s/2,s/2,`面積 ${v}`,'t mid b');P.text(s/2,s,`√${v}`,'t mid t1 b',0,-9);
    out.innerHTML=exact?T(`\\sqrt{${v}}=${n}`)+`（${v} 是完全平方數）`:T(`${n}^2=${n*n}<${v}<${(n+1)**2}=${n+1}^2`)+'<br>所以 '+T(`${n}<\\sqrt{${v}}<${n+1}`)+'，'+T(`\\sqrt{${v}}\\approx${fx(s,3)}`);};
  U.on();}});

C({g:2,ch:'平方根與畢氏定理',t:'畢氏定理（勾股定理）',tex:'a^2+b^2=c^2',
d:'在直角三角形三邊各畫一個正方形：兩個<b>短邊</b>正方形的面積加起來，剛好等於<b>斜邊</b>正方形的面積。例如 3、4、5。',
viz(b){const P=Plot(b,{xr:[-5.8,10.4],yr:[-5.8,10.4],w:300,grid:false,axes:false}),U=Ctl(b);
  const a=U.slider('a',1,5,.5,4),bb=U.slider('b',1,5,.5,3),out=U.out();
  U.on=()=>{P.clear();const A=a.v,B=bb.v,c=Math.hypot(A,B);
    P.rect(0,-A,A,A,'f1');P.rect(-B,0,B,B,'f2');P.poly([[A,0],[0,B],[B,B+A],[A+B,A]],'f3',true);P.poly([[0,0],[A,0],[0,B]],'fg',true);
    P.text(A/2,-A/2,`a² = ${fx(A*A)}`,'t mid b');P.text(-B/2,B/2,`b² = ${fx(B*B)}`,'t mid b');P.text((A+B)/2,(A+B)/2,`c² = ${fx(c*c)}`,'t mid b');
    P.text(A/2,0,'a','t mid t1 b',0,-8);P.text(0,B/2,'b','t t2 b',5);P.rect(0,0,.4,.4,'fn km');
    out.innerHTML=T(`${A}^2+${B}^2=${fx(A*A)}+${fx(B*B)}=${fx(c*c)}`)+'，所以斜邊 '+T(`c=\\sqrt{${fx(c*c)}}${Number.isInteger(c)?'=':'\\approx'}${fx(c)}`);};
  U.on();}});

C({g:2,ch:'平方根與畢氏定理',t:'兩點距離公式',tex:'\\overline{AB}=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}',
d:'兩點之間連線，配上<b style="color:var(--c1)">水平</b>和<b style="color:var(--c2)">垂直</b>兩段，就是一個直角三角形。用畢氏定理就能算出斜邊，也就是兩點距離。',hint:'可拖曳：拖動 A、B 兩點',
viz(b){const P=Plot(b,{xr:[-5,5],yr:[-4,4],w:300}),U=Ctl(b),out=U.out();let p=[-3,-2],q=[2,2];
  P.handle(...p,(x,y)=>{p=ptOK(x,y);U.on();return p;},'h0');P.handle(...q,(x,y)=>{q=ptOK(x,y);U.on();return q;},'h0');
  U.on=()=>{P.clear();const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy);
    P.line(...p,q[0],p[1],'k1');P.line(q[0],p[1],...q,'k2');P.line(...p,...q,'k0');P.text(...p,'A','t b',-14,-6);P.text(...q,'B','t b',8,-8);
    out.innerHTML=T(`\\overline{AB}=\\sqrt{${par(dx)}^2+${par(dy)}^2}=\\sqrt{${fx(dx*dx+dy*dy)}}\\approx${fx(d)}`);};
  U.on();}});

/* ---------- 國二：一元二次方程式 ---------- */
C({g:2,ch:'一元二次方程式',t:'公式解',tex:'ax^2+bx+c=0\\ \\Rightarrow\\ x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}',
d:'方程式的解，就是拋物線 y = ax²+bx+c 和 <b>x 軸的交點</b>。根號裡的 b²−4ac 叫<b>判別式</b>：大於 0 有兩個解，等於 0 有一個（重根），小於 0 沒有實數解。',
viz(b){const P=Plot(b,{xr:[-5,5],yr:[-5,5],w:300}),U=Ctl(b);
  const a=U.slider('a',-2,2,.5,1),bb=U.slider('b',-4,4,1,-1),c=U.slider('c',-4,4,1,-2),out=U.out();
  U.on=()=>{P.clear();const A=a.v,B=bb.v,Cc=c.v;if(A===0){P.fn(x=>B*x+Cc,'k1');out.innerHTML='a = 0 時不是一元二次方程式';return;}
    P.fn(x=>A*x*x+B*x+Cc,'k1');const D=B*B-4*A*Cc;
    let s=T(`${terms([[A,'x^2'],[B,'x'],[Cc,'']])}=0`)+'<br>'+T(`b^2-4ac=${par(B)}^2-4\\times${par(A)}\\times${par(Cc)}=${fx(D)}`);
    if(D>=0){const r1=(-B+Math.sqrt(D))/(2*A),r2=(-B-Math.sqrt(D))/(2*A);P.dot(r1,0,'d2',5);P.dot(r2,0,'d2',5);
      s+='<br>'+T(`x=\\frac{${fx(-B)}\\pm\\sqrt{${fx(D)}}}{${fx(2*A)}}`)+(D===0?`，重根 x = ${fx(r1)}`:`，x = ${fx(Math.max(r1,r2))} 或 ${fx(Math.min(r1,r2))}`);}
    else s+='<br>判別式 &lt; 0：沒有實數解（拋物線碰不到 x 軸）';
    out.innerHTML=s;};
  U.on();}});

/* ---------- 國二：數列與級數 ---------- */
C({g:2,ch:'數列與級數',t:'等差數列與等差級數',tex:'a_n=a_1+(n-1)d,\\qquad S_n=\\frac{n(a_1+a_n)}{2}',
d:'把數列<b style="color:var(--c1)">由小到大</b>排一次，再<b style="color:var(--c2)">倒過來</b>疊上去，每一欄都是 a₁+aₙ，剛好拼成長方形。長方形面積的一半就是總和（高斯的方法）。',
viz(b){const P=Plot(b,{xr:[-.03,1.03],yr:[-.1,1.06],w:300,h:230,grid:false,axes:false}),U=Ctl(b);
  const n=U.slider('n',1,10,1,6),a1=U.slider('a₁',1,5,1,2),d=U.slider('d',0,3,1,1),out=U.out();
  U.on=()=>{P.clear();const N=n.v,A=a1.v,D=d.v,an=A+(N-1)*D,Hh=A+an,cw=1/N;
    for(let i=0;i<N;i++){const v=A+i*D,u=A+(N-1-i)*D;P.rect(i*cw+cw*.06,0,cw*.88,v/Hh,'f1');P.rect(i*cw+cw*.06,v/Hh,cw*.88,u/Hh,'f2');
      if(N<=8){P.text(i*cw+cw/2,v/Hh/2,fx(v),'t mid t1 sm');P.text(i*cw+cw/2,(v+u/2)/Hh,fx(u),'t mid t2 sm');}}
    P.text(.5,0,`n = ${N} 項`,'tm mid',0,10);
    out.innerHTML=T(`a_{${N}}=${A}+(${N}-1)\\times${D}=${an}`)+'<br>'+T(`S_{${N}}=\\frac{${N}\\times(${A}+${an})}{2}=${fx(N*(A+an)/2)}`);};
  U.on();}});


C({g:2,ch:'數列與級數',t:'等比數列',tex:'a_n=a_1\\times r^{\\,n-1}',
d:'每一項都是前一項<b>乘上同一個數 r</b>（公比）。r 大於 1 會越長越快（像細胞分裂），r 介於 0 和 1 之間會越來越小（像每次對折）。',
viz(b){const P=Plot(b,{xr:[-.03,1.03],yr:[-.1,1.06],w:300,h:200,grid:false,axes:false}),U=Ctl(b);
  const a1=U.slider('a₁',1,5,1,1),r=U.slider('r',.5,3,.5,2),n=U.slider('n',1,10,1,7),out=U.out();
  U.on=()=>{P.clear();const N=n.v,A=a1.v,R=r.v,v=[...Array(N)].map((_,i)=>A*R**i),mx=Math.max(...v),w=1/N;
    v.forEach((x,i)=>{P.rect(i*w+w*.08,0,w*.84,x/mx*.9,'f1');if(N<=8)P.text(i*w+w/2,x/mx*.9,fx(x),'tm mid',0,-7);});
    out.innerHTML=`${v.map(x=>fx(x)).join('、')}<br>`+T(`a_{${N}}=${A}\\times${fx(R)}^{${N-1}}=${fx(v[N-1])}`);};
  U.on();}});

/* ---------- 國二：線型函數 ---------- */
C({g:2,ch:'函數',t:'線型函數',tex:'y=ax+b\\qquad a:\\text{斜率}\\quad b:\\text{y 截距}',
d:'<b>b</b> 是直線和 y 軸的交點高度；<b>a</b> 是「x 每增加 1，y 增加多少」。a 為正往右上，a 為負往右下，a = 0 是水平線（常數函數）。',
viz(b){const P=Plot(b,{xr:[-5,5],yr:[-5,5],w:300}),U=Ctl(b);const a=U.slider('a',-3,3,.5,1.5),bb=U.slider('b',-4,4,.5,-1),out=U.out();
  U.on=()=>{P.clear();const A=a.v,B=bb.v;P.fn(x=>A*x+B,'k0');P.line(0,B,1,B,'k1 fat');P.line(1,B,1,B+A,'k2 fat');P.dot(0,B,'d3',5);
    P.text(.5,B,'1','t mid t1 b',0,A>0?12:-10);P.text(1,B+A/2,`a = ${fx(A)}`,'t t2 b',6);P.text(0,B,`(0, ${fx(B)})`,'t t3',-50,-8);
    let s=T('y='+terms([[A,'x'],[B,'']]))+`：斜率 ${fx(A)}，y 截距 ${fx(B)}`;
    if(A!==0){P.dot(-B/A,0,'d4',4);s+=`<br>和 x 軸交於 (${fx(-B/A)}, 0)`;}else s+='<br>a = 0：水平線（常數函數）';
    out.innerHTML=s;};
  U.on();}});

/* ---------- 國二：幾何 ---------- */
C({g:2,ch:'三角形與多邊形',t:'三角形內角和',tex:'\\angle A+\\angle B+\\angle C=180^\\circ',
d:'通過 C 畫一條和 AB <b>平行的虛線</b>。∠A、∠B 會「搬」到 C 的兩側（內錯角相等），三個角剛好拼成一直線，也就是 180°。也因此<b>外角 = 兩個內對角的和</b>。',hint:'可拖曳：拖動三個頂點',
viz(b){const P=Plot(b,{xr:[-5,5],yr:[-4,4],w:300,grid:false,axes:false}),U=Ctl(b),out=U.out();const V=[[-3.5,-2.5],[3.5,-2.5],[-.5,2.5]];
  ['h1','h2','h3'].forEach((h,i)=>P.handle(...V[i],(x,y)=>{V[i]=ptOK(x,y);U.on();return V[i];},h));
  U.on=()=>{P.clear();const [A,B,Cc]=V,ab=sub(B,A);
    P.line(Cc[0]-ab[0]*2,Cc[1]-ab[1]*2,Cc[0]+ab[0]*2,Cc[1]+ab[1]*2,'km dash');
    P.poly(V,'f5',true);
    const m1=arcB(P,A,sub(B,A),sub(Cc,A),.7,'k1'),m2=arcB(P,B,sub(A,B),sub(Cc,B),.7,'k2'),m3=arcB(P,Cc,sub(A,Cc),sub(B,Cc),.6,'k3');
    arcB(P,Cc,sub(A,B),sub(A,Cc),.85,'k1');arcB(P,Cc,ab,sub(B,Cc),.85,'k2');

C({g:2,ch:'三角形與多邊形',t:'多邊形的內角和',tex:'n\\text{ 邊形內角和}=(n-2)\\times180^\\circ,\\qquad \\text{外角和}=360^\\circ',

C({g:3,ch:'圓',t:'三角形的外心、內心、重心',tex:'\\text{外心：}\\overline{OA}=\\overline{OB}=\\overline{OC}\\qquad\\text{內心：到三邊等距}\\qquad\\text{重心：中線分成 }2:1',

function build(){
  const main=document.getElementById('main');
  for(const g of [1,2,3]){
    const sec=H('section','grade',main);sec.dataset.g=g;H('h2','',sec,`${GR[g][0]}<small>${GR[g][1]}</small>`);
    const chs=[...new Set(cards.filter(c=>c.g===g).map(c=>c.ch))];
    for(const ch of chs){
      const cs=H('div','chap',sec);H('h3','',cs,ch);const grid=H('div','grid',cs);
      for(const c of cards.filter(c=>c.g===g&&c.ch===ch)){
        const el=H('article','card',grid);el.dataset.s=(c.t+c.ch+c.d.replace(/<[^>]+>/g,'')).toLowerCase();
        H('h4','',el,c.t);H('div','fml',el,T(c.tex.includes('\\qquad')?'\\begin{gathered}'+c.tex.split('\\qquad').join('\\\\')+'\\end{gathered}':c.tex,true));
        if(c.hint)H('p','hint',el,c.hint);
        try{c.viz(el);}catch(err){H('p','hint',el,'這張圖載入失敗：'+err.message);console.error(err);}
        H('p','plain',el,'💡 '+c.d);
      }
    }
  }
}
function fit(){document.querySelectorAll('.fml').forEach(el=>{el.style.fontSize='';const bs=[...el.querySelectorAll('.katex-html span')].filter(x=>!x.children.length&&x.textContent.trim());if(!bs.length)return;const L=Math.min(...bs.map(x=>x.getBoundingClientRect().left)),R=Math.max(...bs.map(x=>x.getBoundingClientRect().right)),r=el.clientWidth/(R-L);if(r<1)el.style.fontSize=Math.max(.7,r*.98)*1.02+'em';});}
let curG='0';
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('.grade').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('.chap').forEach(ch=>{let n=0;ch.querySelectorAll('.card').forEach(c=>{const ok=!q||c.dataset.s.includes(q);c.hidden=!ok;if(ok)n++;});ch.hidden=!n;if(n)any=true;});
    sec.hidden=!any||(curG!=='0'&&sec.dataset.g!==curG);
  });
}
window.addEventListener('DOMContentLoaded',()=>{
  build();fit();if(document.fonts)document.fonts.ready.then(fit);window.addEventListener('load',fit);window.addEventListener('resize',fit);
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');curG=t.dataset.g;filter();window.scrollTo({top:document.querySelector('.bar').offsetTop,behavior:'smooth'});}));
  document.getElementById('q').addEventListener('input',filter);
});
</script>
</body>
