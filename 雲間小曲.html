<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雲間小曲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="不會重複的隨機生成輕音樂：慢速、柔和、無突兀聲響，搭配呼吸引導，幫助放鬆與安定情緒。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雲間小曲">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* 版面：單欄播放器。上方一顆會呼吸的「月」當播放鍵，音符化成漣漪散開；下方是幾排安靜的選項。 */
:root{
  --bg:#eceef6;
  --bg-2:#dfe3f1;
  --fg:#262b3f;
  --mute:#5f6680;
  --line:rgba(60,70,120,.18);
  --chip:rgba(255,255,255,.6);
  --accent:#555bb0;
  --accent-ink:#ffffff;
  --glow:#e39a5c;
  --orb-a:#fbe3c8;
  --orb-b:#b9bdf0;
  --font-d:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --font-u:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11121d; --bg-2:#191b2c; --fg:#e3e5f1; --mute:#9a9eb8;
    --line:rgba(190,195,240,.16); --chip:rgba(255,255,255,.05);
    --accent:#aab0f2; --accent-ink:#14152a; --glow:#f0b98a;
    --orb-a:#f3cfa6; --orb-b:#5a5fa8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11121d; --bg-2:#191b2c; --fg:#e3e5f1; --mute:#9a9eb8;
  --line:rgba(190,195,240,.16); --chip:rgba(255,255,255,.05);
  --accent:#aab0f2; --accent-ink:#14152a; --glow:#f0b98a;
  --orb-a:#f3cfa6; --orb-b:#5a5fa8; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%) fixed var(--bg);
  color:var(--fg);
  font:400 1rem/1.7 var(--font-u);
  padding-block:1.25rem 2.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
.wrap{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem}
header h1{font:300 2rem/1.2 var(--font-d);letter-spacing:.12em;margin:0}
header p{margin:.35rem 0 0;color:var(--mute);font-size:.9rem}

.stage{position:relative;height:min(46vh,20rem);min-height:15rem;display:grid;place-items:center}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.orb{
  position:relative;width:9.5rem;height:9.5rem;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 38% 34%,var(--orb-a) 0%,var(--orb-b) 78%);
  box-shadow:0 0 3.5rem -0.5rem var(--glow),inset 0 0 1.5rem rgba(255,255,255,.25);
  color:var(--fg);font:400 1.15rem/1.3 var(--font-d);letter-spacing:.2em;
  display:grid;place-items:center;
  transform:scale(var(--s,1));
  -webkit-tap-highlight-color:transparent;
}
.orb span{color:#2a2c48;padding-left:.2em}
.orb:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.now{text-align:center;display:flex;flex-direction:column;gap:.15rem}
.now .hint{font:400 1.05rem/1.4 var(--font-d);letter-spacing:.15em;min-height:1.5em}
.now .meta{color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums;min-height:1.4em}

.group{display:flex;flex-direction:column;gap:.5rem}
.group h2{margin:0;font:500 .78rem/1.4 var(--font-u);letter-spacing:.18em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  font:400 .92rem/1 var(--font-u);color:var(--fg);background:var(--chip);
  border:1px solid var(--line);border-radius:999px;padding:.62rem .95rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mood-note{color:var(--mute);font-size:.85rem;margin:0;min-height:1.5em}
.vol{display:flex;align-items:center;gap:.75rem}
.vol label{font-size:.9rem;width:3.2em;flex:none}
.vol input{flex:1;min-width:0;accent-color:var(--accent);height:2rem}
.vol output{color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums;width:2.5em;text-align:right}
footer{border-top:1px solid var(--line);padding-top:1rem;color:var(--mute);font-size:.82rem}
footer p{margin:0 0 .5rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>雲間小曲</h1>
    <p>每一段旋律都是當下才寫出來的，不會重複，也沒有結尾。</p>
  </header>

  <div class="stage">
    <canvas id="ripples" aria-hidden="true"></canvas>
    <button class="orb" id="orb" type="button" aria-label="開始播放"><span id="orbText">開始</span></button>
  </div>

  <div class="now" aria-live="polite">
    <div class="hint" id="hint">輕觸月亮，音樂就會開始</div>
    <div class="meta" id="meta">建議戴上耳機，音量調到剛好聽得見</div>
  </div>

  <section class="group">
    <h2>曲風</h2>
    <div class="chips" id="moods"></div>
    <p class="mood-note" id="moodNote"></p>
  </section>

  <section class="group">
    <h2>和弦走向</h2>
    <div class="chips" id="progs"></div>
    <p class="mood-note" id="progNote"></p>
  </section>

  <section class="group">
    <h2>自然聲</h2>
    <div class="chips" id="natures"></div>
  </section>

  <section class="group">
    <h2>音量</h2>
    <div class="vol">
      <label for="vol">音樂</label>
      <input type="range" id="vol" min="0" max="100" value="70">
      <output id="volOut" for="vol">70</output>
    </div>
    <div class="vol">
      <label for="natVol">自然聲</label>
      <input type="range" id="natVol" min="0" max="100" value="40">
      <output id="natVolOut" for="natVol">40</output>
    </div>
  </section>

  <section class="group">
    <h2>定時停止</h2>
    <div class="chips" id="timers"></div>
  </section>

  <section class="group">
    <h2>呼吸引導</h2>
    <div class="chips">
      <button class="chip" id="breath" type="button" aria-pressed="true">跟著月亮呼吸（吸 4 秒、吐 6 秒）</button>
    </div>
  </section>

  <section class="group">
    <h2>背景播放</h2>
    <div class="chips">
      <button class="chip" id="bg" type="button" aria-pressed="true">關螢幕或切到別的 App 時繼續播放</button>
    </div>
    <p class="mood-note" id="bgNote"></p>
  </section>

  <footer>
    <p>音樂的設計依據：每分鐘 40–66 拍的慢速、五聲音階旋律（沒有不和諧音）、緩起緩收的長音、沒有鼓點與突然的大聲。每分鐘 6 次的慢呼吸有助於身體放鬆。</p>
    <p>iPhone 若沒有聲音，請確認側邊靜音鍵與媒體音量。背景播放在 Safari 直接開啟網頁時最穩定。這是放鬆輔助工具，不能取代醫療。</p>
  </footer>
</div>

<script>
'use strict';
/* ========= 樂理資料 ========= */
const MAJ=[0,2,4,5,7,9,11];
const NOTE=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const CHORD_SUFFIX=['maj7','m7','m7','maj7','sus4','m7'];
// 和弦走向（馬可夫鏈）：級數 → [下一個級數, 權重]
const NEXT={
  0:[[3,3],[5,3],[2,1],[1,2],[4,1]],
  1:[[3,2],[4,2],[0,2],[5,1]],
  2:[[5,3],[3,3],[1,1]],
  3:[[0,3],[5,2],[1,2],[4,2]],
  4:[[0,3],[5,3],[3,2]],
  5:[[3,3],[1,2],[0,2],[2,1]]
};
const MOODS={
  mist:{name:'晨霧',note:'鋼琴主奏、弦樂鋪底，長笛偶爾接一句，豎琴點綴。適合靜下來、整理思緒。',
    bpm:[56,62],home:0,bias:{0:2,3:1.5,5:1},lead:'piano',alt:'flute',altP:.28,altShift:0,arpInst:'harp',arp:.25,padType:'strings',
    density:.4,pad:.6,send:.5,range:[60,86],spark:.12,mode:k=>NOTE[k%12]+' 大調'},
  brook:{name:'溪畔',note:'古箏主奏，洞簫低低地應和，豎琴像水光。帶一點東方山水的味道。',
    bpm:[56,62],home:0,bias:{0:2,5:1.5,3:1,1:1},lead:'zheng',alt:'flute',altP:.4,altShift:-12,arpInst:'harp',arp:.35,padType:'strings',
    density:.42,pad:.42,send:.55,range:[60,84],spark:.08,mode:k=>NOTE[k%12]+' 宮調式'},
  forest:{name:'林間',note:'拇指琴的木質音色配上長笛，稍微輕快一點點。適合白天舒緩緊繃。',
    bpm:[60,66],home:0,bias:{0:2,3:1.3,4:1,1:1},lead:'kalimba',alt:'flute',altP:.35,altShift:0,arpInst:'kalimba',arp:.5,padType:'warm',
    density:.46,pad:.45,send:.45,range:[57,81],spark:.1,mode:k=>NOTE[k%12]+' 大調'},
  dusk:{name:'暮弦',note:'大提琴慢慢地唱，鋼琴在高處回應，弦樂鋪底。溫暖、沉穩，適合一天的收尾。',
    bpm:[50,56],home:5,bias:{5:2.2,3:1.6,0:1.2,2:1,4:.4},lead:'bow',alt:'piano',altP:.38,altShift:12,arpInst:'piano',arp:.4,padType:'strings',
    density:.34,pad:.55,send:.6,range:[48,69],spark:.06,mode:k=>NOTE[(k+9)%12]+' 小調'},
  star:{name:'星夜',note:'音樂盒般的清脆小音配豎琴，帶一點夜晚的涼意。適合睡前或想獨處時。',
    bpm:[50,56],home:5,bias:{5:2.5,3:1.5,2:1.2,4:.4},lead:'box',alt:'harp',altP:.3,altShift:-12,arpInst:'harp',arp:.2,padType:'warm',
    density:.32,pad:.6,send:.65,range:[67,91],spark:.15,mode:k=>NOTE[(k+9)%12]+' 小調'},
  sea:{name:'深海',note:'最空曠的一種。緩緩起伏的長音、遠方的鐘，偶爾一段低沉的大提琴。適合煩躁或睡前。',
    bpm:[44,50],home:3,bias:{3:2.5,0:1,1:1.2,4:.5},lead:'bell',alt:'bow',altP:.3,altShift:-12,arpInst:'bell',arp:0,padType:'warm',
    density:.2,grid:2,pad:.75,send:.75,range:[55,79],spark:.14,mode:k=>NOTE[(k+5)%12]+' 利地亞調式'},
  cosmos:{name:'宇宙',note:'最慢。小提琴拉著很長的音，飄在厚厚的和聲上，星點般的鐘聲散落。適合放空。',
    bpm:[40,46],home:1,bias:{1:2.5,3:1.6,0:1,5:1,4:.4},lead:'bow',alt:'bell',altP:.4,altShift:0,arpInst:'bell',arp:.1,padType:'both',
    density:.3,grid:4,pad:.8,send:.9,range:[64,84],spark:.45,mode:k=>NOTE[(k+2)%12]+' 多里安調式'}
};
// 經典和弦進行（以級數表示：0=I、1=ii、2=iii、3=IV、4=V、5=vi）
const ROMAN=['I','ii','iii','IV','V','vi'];
const major=k=>NOTE[k%12]+' 大調',minor=k=>NOTE[(k+9)%12]+' 小調';
const PROGS={
  canon:{name:'卡農',seq:[0,4,5,2,3,0,3,4],mode:major,note:'帕海貝爾〈卡農〉的進行，最耐聽的八個和弦。'},
  pop:{name:'流行四和弦',seq:[0,4,5,3],mode:major,note:'無數流行歌共用的四個和弦，明亮而熟悉。'},
  fifties:{name:'五〇年代',seq:[0,5,3,4],mode:major,note:'老情歌常用的進行，溫暖、懷舊。'},
  pastoral:{name:'田園',seq:[0,3,0,4],mode:major,note:'最單純的三個和弦，像民謠與聖詠，安穩踏實。'},
  royal:{name:'王道進行',seq:[3,4,2,5],mode:minor,note:'日本流行樂最愛的進行，帶著一點惆悵的甜。'},
  lyric:{name:'抒情小調',seq:[5,3,0,4],mode:minor,note:'從小調出發再走向明亮，適合沉澱情緒。'},
  jazz:{name:'爵士二五一',seq:[1,4,0,5],mode:major,note:'爵士樂的基本句型，圓滑、慵懶。'},
  dorian:{name:'多里安',seq:[1,4,1,3],mode:k=>NOTE[(k+2)%12]+' 多里安調式',note:'兩個和弦來回擺盪，空靈、不落地。'},
  lydian:{name:'利地亞',seq:[3,0,3,1],mode:k=>NOTE[(k+5)%12]+' 利地亞調式',note:'電影配樂常用的漂浮感，像在水中或太空。'}
};
const PROG_ORDER=['canon','pop','fifties','pastoral','royal','lyric','jazz','dorian','lydian'];
// 各曲風在「自動」時偏好的經典進行
const MOOD_PROGS={mist:['canon','pop','fifties','pastoral'],brook:['fifties','pastoral','pop','canon'],forest:['pop','fifties','canon','pastoral'],
  dusk:['lyric','royal','jazz'],star:['lyric','royal','canon'],sea:['lydian','royal'],cosmos:['dorian','lydian']};
const MOOD_ORDER=['mist','brook','forest','dusk','star','sea','cosmos'];
const NATURES={none:'無',rain:'細雨',brook:'溪流',sea:'海浪',fire:'燒柴',wheel:'水車'};
// 各自然聲的音量校正，讓它們彼此差不多大聲
const FDN_LEVEL=.45;
// 省運算模式：手機在背景或關螢幕時，改用輕量殘響並減少每個音的疊加層數，避免爆音
let liteOn=false;
const lite=()=>liteOn;
function setLite(on){
  if(!A||on===liteOn)return;liteOn=on;
  ramp(A.convGate.gain,on?0:1,1.2);ramp(A.fdnGate.gain,on?1:0,1.2);
}
const NAT={}; // 各自然聲的建立函式，選到才建立
const NAT_TRIM={rain:1.2,brook:.8,sea:.45,fire:.7,wheel:1.2};
const TIMERS=[0,15,30,60];

const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function wpick(pairs){let s=0;for(const p of pairs)s+=p[1];let r=Math.random()*s;for(const p of pairs){r-=p[1];if(r<=0)return p[0]}return pairs[0][0]}

/* ========= 狀態 ========= */
const S={progSel:'auto',prog:null,pi:0,chordBars:2,cb:0,progDirty:false,sel:'mist',mood:'mist',pending:null,key:48+Math.floor(Math.random()*12),bpm:58,deg:0,bar:0,nextBar:0,
  chordsLeft:0,phrase:0,rest:1,mi:0,ladder:[],pcs:[],padNotes:[],nature:'none',vol:.7,natVol:.4,voice:'lead',playing:false,breath:true,bg:true,timerEnd:0,first:true};
function load(){try{const o=JSON.parse(localStorage.getItem('yunjian')||'{}');
  if(o.sel&&(MOODS[o.sel]||o.sel==='auto'))S.sel=o.sel;if(PROGS[o.progSel]||o.progSel==='auto'||o.progSel==='free')S.progSel=o.progSel;if(NATURES[o.nature])S.nature=o.nature;
  if(typeof o.vol==='number')S.vol=Math.min(1,Math.max(0,o.vol));if(typeof o.natVol==='number')S.natVol=Math.min(1,Math.max(0,o.natVol));if(typeof o.breath==='boolean')S.breath=o.breath;if(typeof o.bg==='boolean')S.bg=o.bg}catch(e){}}
function save(){try{localStorage.setItem('yunjian',JSON.stringify({sel:S.sel,progSel:S.progSel,nature:S.nature,vol:S.vol,natVol:S.natVol,breath:S.breath,bg:S.bg}))}catch(e){}}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)S.breath=false;
load();
const volGain=()=>S.vol*S.vol*1.4,natGain=()=>S.natVol*S.natVol*1.4;
S.mood=S.sel==='auto'?pick(MOOD_ORDER):S.sel;

/* ========= 音訊線路 ========= */
let ctx=null,A=null;
const events=[]; // 給畫面用：{t, kind, ...}

function noiseBuffer(sec,brown){
  const sr=ctx.sampleRate,L=Math.floor(sr*sec),N=Math.floor(sr*.5),g=new Float32Array(L+N);
  let last=0,peak=0;
  for(let i=0;i<L+N;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;g[i]=last}else g[i]=w;peak=Math.max(peak,Math.abs(g[i]))}
  const b=ctx.createBuffer(1,L,sr),d=b.getChannelData(0);
  for(let i=0;i<L;i++)d[i]=g[i]/peak;
  for(let i=0;i<N;i++){const w=i/N;d[i]=(g[i]*w+g[L+i]*(1-w))/peak} // 首尾交叉淡接，循環時沒有接縫
  return b;
}
// 稀疏事件的循環音：雨滴、柴火爆裂、水泡
function sparse(sec,rate,ev){
  const sr=ctx.sampleRate,L=Math.floor(sr*sec),b=ctx.createBuffer(1,L,sr),d=b.getChannelData(0);
  let i=0;for(;;){i+=Math.floor(-Math.log(1-Math.random())/rate*sr)+1;if(i>=L-sr*.1)break;ev(d,i,sr)}
  return b;
}
function impulse(sec){
  const sr=ctx.sampleRate,n=Math.floor(sr*sec),b=ctx.createBuffer(2,n,sr),pre=Math.floor(sr*.018);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lo=0;
    for(let i=pre;i<n;i++){const t=(i-pre)/sr,w=Math.random()*2-1;lo+=(w-lo)*.06;
      // 低頻殘響留得久、高頻散得快，像木造的大廳
      d[i]=(lo*3.2*Math.exp(-t/.78)+(w-lo)*.5*Math.exp(-t/.42))*Math.min(1,.2+t/.03)*Math.min(1,(n-i)/(sr*.4))}
    for(let k=0;k<7;k++)d[pre+Math.floor(sr*rnd(.004,.075))]+=(Math.random()<.5?-1:1)*rnd(.25,.6); // 早期反射
  }
  return b;
}
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  // Android 進背景或關螢幕後處理器會降速；把緩衝區開到最大，才不會來不及運算而出現爆音
  try{ctx=new AC({latencyHint:/Android/i.test(navigator.userAgent)?.3:'playback'})}catch(e){ctx=new AC()}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  const g=v=>{const n=ctx.createGain();n.gain.value=v;return n};
  A={mix:g(1),vol:g(volGain()),natVol:g(natGain()),white:null,fade:g(0),comp:ctx.createDynamicsCompressor(),
     rev:ctx.createConvolver(),revOut:g(.9),
     mel:g(1),melSend:g(MOODS[S.mood].send),
     pad:g(MOODS[S.mood].pad),padSend:g(.7),padLP:ctx.createBiquadFilter(),
     nat:{}};
  A.comp.threshold.value=-20;A.comp.knee.value=18;A.comp.ratio.value=3;A.comp.attack.value=.05;A.comp.release.value=.5;
  A.rev.buffer=impulse(MOBILE?3.6:6); // 手機用短一點的殘響，省運算
  A.padLP.type='lowpass';A.padLP.frequency.value=950;A.padLP.Q.value=.3;
  A.out=g(1);A.mix.connect(A.vol).connect(A.fade).connect(A.comp).connect(A.out);
  A.natVol.connect(A.fade);
  A.revIn=g(1);A.convGate=g(1);A.fdnGate=g(0);
  A.revIn.connect(A.convGate).connect(A.rev);A.rev.connect(A.revOut).connect(A.mix);
  // 輕量殘響：六條延遲線互相錯開。運算量很小，手機進背景時改用它
  {const mg=ctx.createChannelMerger(2),fo=g(FDN_LEVEL);

function ramp(param,v,sec){const t=ctx.currentTime;param.cancelScheduledValues(t);param.setValueAtTime(param.value,t);param.linearRampToValueAtTime(v,t+sec)}
function setNature(id,quiet){
  S.nature=id;

    for(const k in A.nat){const n=A.nat[k];
      if(k===id){n.dead=false;ramp(n.o.gain,1,2.5)}
      else if(!n.dead){n.dead=true;ramp(n.o.gain,0,2.5);
        setTimeout(()=>{if(!n.dead)return;n.nodes.forEach(x=>{try{x.stop()}catch(e){}});n.tr.disconnect();if(A.nat[k]===n)delete A.nat[k]},2900)}}
    if(NAT[id]&&!A.nat[id]){NAT[id]();ramp(A.nat[id].o.gain,1,quiet?.05:2.5)}

/* ========= 樂器 ========= */
const INST={
  piano:{kind:'piano'},
  bell:{att:.035,dec:4.6,level:.13,dbl:3,parts:[[1,1,1],[2.005,.14,.6],[4,.12,.3],[10.1,.02,.08]]},
  box:{att:.003,dec:2.2,level:.125,dbl:4,click:[6,.03,.012],parts:[[1,1,1],[2,.06,.5],[6.27,.07,.1]]},
  kalimba:{att:.003,dec:1.6,level:.15,dbl:6,click:[3,.06,.02],parts:[[1,1,1],[2,.12,.4],[6.27,.07,.05]]},
  harp:{kind:'ks'},
  zheng:{kind:'ks'},
  flute:{kind:'sus',att:.09,rel:.25,level:.11,vib:[4.9,5],trem:.13,breath:.018,chiff:.045,scoop:22,parts:[[1,1],[2,.3],[3,.1],[4,.03]]},
  bow:{kind:'sus',att:.22,rel:.45,level:.055,vib:[5.3,11],trem:.06,breath:.003,scoop:8,saw:true}
};
// 撥弦的物理模型參數：bright 撥弦的亮度、pos 撥弦位置、b 高頻衰減、t60 餘音長度
const KS={zheng:{bright:.8,pos:.12,b:.15,t60:3.4,len:2.8,level:.25,lp:7500},
          harp:{bright:.28,pos:.31,b:.4,t60:2.8,len:2.4,level:.2,lp:3800}};
// 依樂器種類分派：琴鍵與撥弦類自然衰減，管與弦則依音符長度持續
function play1(t,midi,vel,id,dur,visual){
  const I=INST[id];
  if(I.kind==='sus')susNote(t,dur,midi,vel,I);else if(I.kind==='ks')pluck(t,midi,vel,id);else if(I.kind==='piano')piano(t,midi,vel);else{note(t,midi,vel,id,visual);return}
  if(visual!==false)events.push({t,kind:'note',midi,vel});
}
function panner(midi){
  const pan=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();
  if(pan.pan)pan.pan.value=Math.max(-.6,Math.min(.6,(midi-72)/30+rnd(-.2,.2)));
  pan.connect(A.mel);return pan;
}
// 短促的氣聲或敲擊聲（琴槌、撥片、笛子的起音）
function burst(t,dest,freq,q,level,dur){
  const n=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=A.white;
  bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=q;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(bp).connect(g).connect(dest);n.start(t,Math.random()*5);n.stop(t+dur+.02);
}
// 鋼琴：泛音豐富的波形，兩條弦微微錯開，音色隨時間由亮轉暗，加一點琴槌聲
let pianoWave=null;
function piano(t,midi,vel){
  if(!pianoWave){const n=18,re=new Float32Array(n),im=new Float32Array(n);
    for(let k=1;k<n;k++)im[k]=Math.pow(k,-1.2)*(k%7===0?.25:1)*(k%2?1:.85);pianoWave=ctx.createPeriodicWave(re,im)}
  const f=mtof(midi),pan=panner(midi),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  const dec=3.6*Math.max(.5,1-(midi-60)/80),peak=vel*.105*Math.max(.45,1-(midi-60)/75);
  lp.type='lowpass';lp.Q.value=.5;lp.frequency.setValueAtTime(Math.min(9000,f*(4+vel*8)),t);lp.frequency.exponentialRampToValueAtTime(f*2.2,t+1.2);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.006);g.gain.setTargetAtTime(peak*.42,t+.006,.11);g.gain.setTargetAtTime(0,t+.45,dec/3.5);
  lp.connect(g).connect(pan);let first=null;
  for(const det of [-1.4,1.4]){const o=ctx.createOscillator();o.setPeriodicWave(pianoWave);o.frequency.value=f;o.detune.value=det;
    o.connect(lp);o.start(t);o.stop(t+.5+dec*1.8);first=first||o}
  burst(t,pan,Math.min(3000,f*2),.7,vel*.02,.03);
  first.onended=()=>pan.disconnect();
}
// 古箏與豎琴：用弦振動的物理模型（Karplus-Strong）算出每個音，再播放
const ksCache=new Map();
function ksBuf(kind,midi){
  const key=kind+midi;let hit=ksCache.get(key);
  if(hit){ksCache.delete(key);ksCache.set(key,hit);return hit}
  const P=KS[kind],sr=32000,f=mtof(midi),N=Math.round(sr/f),L=Math.floor(sr*P.len),d=new Float32Array(L);
  let lp=0,mean=0;const ex=new Float32Array(N);
  for(let i=0;i<N;i++){lp+=((Math.random()*2-1)-lp)*P.bright;ex[i]=lp;mean+=lp/N}
  const pos=Math.max(1,Math.floor(N*P.pos));
  for(let i=0;i<N;i++)d[i]=(ex[i]-mean)-(ex[(i-pos+N)%N]-mean);
  const damp=Math.pow(10,-3/(f*P.t60*Math.max(.5,1-(midi-60)/70)));
  for(let i=N+1;i<L;i++)d[i]=((1-P.b)*d[i-N]+P.b*d[i-N-1])*damp;
  let pk=0;for(let i=0;i<L;i++)pk=Math.max(pk,Math.abs(d[i]));
  const fade=sr*.06;for(let i=0;i<L;i++)d[i]=d[i]/pk*Math.min(1,(L-i)/fade);
  const b=ctx.createBuffer(1,L,sr);b.getChannelData(0).set(d);
  ksCache.set(key,{b,rate:f*N/sr});
  if(ksCache.size>36)ksCache.delete(ksCache.keys().next().value);
  return ksCache.get(key);
}
function pluck(t,midi,vel,kind){
  const P=KS[kind],{b,rate}=ksBuf(kind,midi),pan=panner(midi),src=ctx.createBufferSource(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=b;
  if(kind==='zheng'){src.playbackRate.setValueAtTime(rate*1.013,t);src.playbackRate.exponentialRampToValueAtTime(rate,t+.06)} // 起音的小滑音
  else src.playbackRate.value=rate;
  lp.type='lowpass';lp.frequency.value=P.lp*(.6+.5*vel);lp.Q.value=.4;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel*P.level*Math.max(.45,1-(midi-60)/75),t+.003);
  src.connect(lp).connect(g).connect(pan);src.start(t);src.onended=()=>pan.disconnect();
}
// 管樂與弦樂：緩緩起音、持續、帶揉音；長笛有氣聲與吐音，提琴有琴身共鳴
function susNote(t,dur,midi,vel,I){
  const f=mtof(midi),pan=panner(midi),g=ctx.createGain(),end=t+dur+I.rel*2.2,peak=vel*I.level;
  g.gain.setValueAtTime(0,t);g.gain.setTargetAtTime(peak,t,I.att/3);g.gain.setTargetAtTime(0,t+dur,I.rel/3);
  let dest=g;
  if(I.saw){
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=.4;
    lp.frequency.setValueAtTime(300+f*1.5,t);lp.frequency.setTargetAtTime(Math.min(3400,800+f*3.2),t,I.att*.9); // 運弓後音色才慢慢亮起來
    let node=lp;
    for(const [ff,db,q] of (lite()?[]:midi<58?[[190,5,2],[420,3,2],[1500,4,1.5]]:[[290,5,2],[560,3,2],[2700,5,1.5]])){ // 琴身共鳴
      const pk=ctx.createBiquadFilter();pk.type='peaking';pk.frequency.value=ff;pk.gain.value=db;pk.Q.value=q;node.connect(pk);node=pk}
    node.connect(g);dest=lp;
  }
  g.connect(pan);
  const vib=ctx.createOscillator(),vg=ctx.createGain(),tg=ctx.createGain(),v0=t+Math.min(.35,dur*.4);
  vib.frequency.value=I.vib[0]+rnd(-.3,.3);
  vg.gain.setValueAtTime(0,t);vg.gain.setValueAtTime(0,v0);vg.gain.linearRampToValueAtTime(I.vib[1],v0+.5);
  tg.gain.setValueAtTime(0,t);tg.gain.setValueAtTime(0,v0);tg.gain.linearRampToValueAtTime(I.trem*peak,v0+.5);
  vib.connect(vg);vib.connect(tg).connect(g.gain);vib.start(t);vib.stop(end);
  const mk=(type,mul,lv,det)=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=type;o.frequency.value=f*mul;og.gain.value=lv;
    o.detune.setValueAtTime(det-I.scoop,t);o.detune.linearRampToValueAtTime(det,t+.09); // 起音從略低處滑上來
    vg.connect(o.detune);o.connect(og).connect(dest);o.start(t);o.stop(end);return o};
  let first;
  if(I.saw){first=mk('sawtooth',1,.5,-7);if(lite())mk('sawtooth',1,.8,6);else{mk('sawtooth',1,.45,0);mk('sawtooth',1,.4,6)}}
  else for(const [mul,lv] of I.parts){const o=mk('sine',mul,lv,0);first=first||o}
  if(I.breath&&!lite()){const n=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();n.buffer=A.white;n.loop=true;
    bp.type='bandpass';bp.frequency.value=I.saw?4000:Math.min(6000,f*2.5);bp.Q.value=.8;ng.gain.value=I.breath*(midi<60?1.6:1)/I.level;
    n.connect(bp).connect(ng).connect(g);n.start(t,Math.random()*4);n.stop(end)}
  if(I.chiff)burst(t,pan,Math.min(5000,f*3),1.5,vel*I.chiff,.06);
  first.onended=()=>pan.disconnect();
}
function note(t,midi,vel,instId,visual){
  const I=INST[instId],f=mtof(midi);
  const soft=Math.max(.35,1-(midi-60)/70); // 越高的音越輕，避免刺耳
  const pan=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();
  if(pan.pan)pan.pan.value=Math.max(-.6,Math.min(.6,(midi-72)/30+rnd(-.2,.2)));
  pan.connect(A.mel);
  const dec=I.dec*Math.max(.55,1-(midi-60)/90);let last=null;
  const parts=I.dbl&&!lite()?[...I.parts,[Math.pow(2,I.dbl/1200),.55,1]]:I.parts;
  if(I.click)burst(t,pan,Math.min(8000,f*I.click[0]),1,vel*I.click[1],I.click[2]);
  for(const [mul,amp,dm] of parts){
    if(f*mul>9000)continue;
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*mul;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel*soft*I.level*amp,t+I.att);
    g.gain.setTargetAtTime(0,t+I.att,dec*dm/4);
    o.connect(g).connect(pan);o.start(t);o.stop(t+I.att+dec*dm*1.7+.1);
    if(mul===1)last=o;
  }
  if(last)last.onended=()=>pan.disconnect();
  if(visual!==false)events.push({t,kind:'note',midi,vel});
}
function sustain(t,dur,midi,peak,atk,rel,dest,type){
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);
  g.gain.setTargetAtTime(peak,t,atk/3);g.gain.setTargetAtTime(0,t+dur,rel/3);
  const L=lite();let pn=null;
  if(!L&&dest===A.padLP&&ctx.createStereoPanner){pn=ctx.createStereoPanner();pn.pan.value=rnd(-.65,.65);g.connect(pn).connect(dest)}else g.connect(dest);
  const end=t+dur+rel*2.2;
  const mk=(wave,det,lv)=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=wave;o.frequency.value=mtof(midi);o.detune.value=det;og.gain.value=lv;
    o.connect(og).connect(g);o.start(t);o.stop(end);return o};
  const a=mk('sine',-4,type==='strings'?.45:.7);
  if(type==='warm'||(type==='both'&&!L))mk('triangle',5,.45);
  if(type==='strings'||type==='both'){
    if(L)mk('sawtooth',6,.4);else{mk('sawtooth',-8,.17);mk('sawtooth',0,.13);mk('sawtooth',9,.17)} // 弦樂群
  }
  a.onended=()=>{g.disconnect();if(pn)pn.disconnect()};
}

/* ========= 作曲 ========= */
const deg=n=>S.key+12*Math.floor(n/7)+MAJ[((n%7)+7)%7];
function buildLadder(){
  const [lo,hi]=MOODS[S.mood].range,L=[];
  for(let m=lo;m<=hi;m++){const pc=((m-S.key)%12+12)%12;if(pc===0||pc===2||pc===4||pc===7||pc===9)L.push(m)}
  const old=S.ladder[S.mi];S.ladder=L;
  if(old==null)S.mi=Math.floor(L.length/2);
  else{let best=0;for(let i=0;i<L.length;i++)if(Math.abs(L[i]-old)<Math.abs(L[best]-old))best=i;S.mi=best}
}
/* ========= 背景播放 =========
   網頁合成的聲音在手機切到背景時通常會被系統停掉。這裡把聲音改接到一個
   <audio> 播放器，系統會把它當成「正在播放的音樂」，關螢幕也能繼續，
   鎖定畫面還會出現播放／暫停按鈕。 */
let bgEl=null,bgOn=false,silent=null;
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MOBILE=IOS||/Android/i.test(navigator.userAgent);
// 一段 10 秒的無聲音檔。Android 上聲音照常直接輸出，只靠它讓系統知道「這個分頁正在播音樂」
function silentUrl(){
  if(silent)return silent;
  const n=80000,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return silent=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function route(){
  if(!A)return;
  const wire=dest=>{try{A.out.disconnect()}catch(e){}A.out.connect(dest)};
  bgOn=false;
  if(S.bg){
    try{
      if(!bgEl){bgEl=document.createElement('audio');bgEl.setAttribute('playsinline','');bgEl.hidden=true;document.body.appendChild(bgEl)}
      if(IOS&&ctx.createMediaStreamDestination){
        // iPhone／iPad：聲音要經過播放器才不會在背景被停掉
        if(!A.msd){A.msd=ctx.createMediaStreamDestination();bgEl.srcObject=A.msd.stream}
        wire(A.msd);bgOn=true;
        const pr=bgEl.play();if(pr&&pr.catch)pr.catch(()=>{bgOn=false;wire(ctx.destination);renderBg()});
      }else{
        // Android 與電腦：聲音直接輸出（經過播放器反而會斷斷續續），另外循環播放無聲音檔保持分頁在背景運作
        wire(ctx.destination);
        if(!bgEl.src){bgEl.src=silentUrl();bgEl.loop=true}
        bgOn=true;
        const pr=bgEl.play();if(pr&&pr.catch)pr.catch(()=>{bgOn=false;renderBg()});
      }
    }catch(e){bgOn=false;wire(ctx.destination)}
  }else{wire(ctx.destination);if(bgEl)bgEl.pause()}
  renderBg();
}
function renderBg(){
  $('bg').setAttribute('aria-pressed',S.bg?'true':'false');
  $('bgNote').textContent=!S.bg?'已關閉：離開這個頁面時音樂可能會停。':(A&&!bgOn?'這個瀏覽器不支援背景播放，離開頁面時音樂可能會停。':'若開啟後沒有聲音或聲音怪怪的，請把這一項關掉。');
}
function mediaInfo(){
  if(!('mediaSession' in navigator))return;
  try{
    if(window.MediaMetadata)navigator.mediaSession.metadata=new MediaMetadata({title:'雲間小曲・'+MOODS[S.mood].name,artist:'隨機生成的輕音樂',album:NATURES[S.nature]==='無'?'':'自然聲：'+NATURES[S.nature]});
    navigator.mediaSession.playbackState=S.playing?'playing':'paused';
    navigator.mediaSession.setActionHandler('play',()=>play());
    navigator.mediaSession.setActionHandler('pause',()=>pause());
  }catch(e){}
}
function applyMood(id){
  S.mood=id;const M=MOODS[id];
  S.bpm=Math.round(rnd(M.bpm[0],M.bpm[1]));
  ramp(A.melSend.gain,M.send,3);ramp(A.pad.gain,M.pad,4);
  buildLadder();mediaInfo();
}
// 決定這一段要用哪個和弦進行：指定的經典進行、依曲風挑選、或自由漫遊
function pickProg(){
  const M=MOODS[S.mood];
  if(S.progSel==='free')S.prog=null;
  else if(S.progSel==='auto')S.prog=Math.random()<.65?pick(MOOD_PROGS[S.mood]):null;
  else S.prog=S.progSel;
  S.pi=0;S.progDirty=false;
  if(S.prog){ // 經典進行每小節換一個和弦才聽得出來；最慢的兩種曲風維持兩小節
    const len=PROGS[S.prog].seq.length;S.chordBars=M.bpm[0]>=50?1:2;
    S.chordsLeft=len*Math.ceil((S.chordBars===1?16:8)/len);S.deg=PROGS[S.prog].seq[0];
  }else{S.chordBars=2;S.chordsLeft=Math.floor(rnd(10,17));S.deg=M.home}
}
function nextChord(){
  const M=MOODS[S.mood];
  if(S.chordsLeft<=0){
    if(!S.first){ // 換調：往上四度或五度，聽起來像雲換了顏色
      S.key=48+((S.key-48+pick([5,7,5,7,2,10]))%12);
      if(S.sel==='auto')applyMood(pick(MOOD_ORDER.filter(m=>m!==S.mood)));
      else{S.bpm=Math.round(rnd(M.bpm[0],M.bpm[1]));buildLadder()}
    }
    S.first=false;pickProg();
  }else if(S.progDirty)pickProg();
  else if(S.prog){const q=PROGS[S.prog].seq;S.deg=q[++S.pi%q.length]}
  else{
    const b=MOODS[S.mood].bias;
    S.deg=wpick(NEXT[S.deg].map(([d,w])=>[d,w*(b[d]||.6)]));
  }
  S.chordsLeft--;
  const d=S.deg;
  let bass=deg(d)-12;while(bass>45)bass-=12;
  let pads=d===4?[deg(d),deg(d+4),deg(d+8),deg(d+10)]:[deg(d),deg(d+4),deg(d+9),deg(d+6)];
  if(d===0||d===3)pads.push(deg(d+8));
  pads=pads.map(m=>{while(m>74)m-=12;return m});
  S.padNotes=[...new Set(pads)].sort((a,b)=>a-b);
  S.pcs=[deg(d)%12,deg(d+2)%12,deg(d+4)%12];
  return bass;
}
function scheduleBar(t){
  if(S.pending){applyMood(S.pending);S.pending=null}
  const M=MOODS[S.mood],beat=60/S.bpm,bar=beat*4;
  if(S.cb<=0){
    const bass=nextChord(),M2=MOODS[S.mood],dur=bar*S.chordBars,quick=S.chordBars===1;
    S.cb=S.chordBars;
    for(const m of S.padNotes)sustain(t+rnd(0,.25),dur,m,.05,quick?1.6:2.6,quick?2.6:4,A.padLP,M2.padType);
    sustain(t,dur,bass,.1,quick?1:1.4,quick?2:3,A.pad,'sine');sustain(t,dur,bass+12,.03,quick?1:1.4,quick?2:3,A.pad,'sine');
    events.push({t,kind:'info',text:(S.prog?PROGS[S.prog].mode:M2.mode)(S.key)+'・每分鐘 '+S.bpm+' 拍・'+NOTE[deg(S.deg)%12]+CHORD_SUFFIX[S.deg]+(S.prog?'・'+PROGS[S.prog].name:'')});
  }
  S.cb--;
  // 樂句：唱幾小節、停幾小節，留白讓耳朵休息
  if(S.phrase<=0&&S.rest<=0){
    if(Math.random()<.5+M.density){S.phrase=Math.floor(rnd(2,5));S.voice=Math.random()<M.altP?'alt':'lead'}else S.rest=1; // 每一句由主奏或搭配的樂器來唱
  }
  if(S.phrase>0){
    S.phrase--;if(S.phrase===0)S.rest=Math.floor(rnd(1,3.4));
    const id=S.voice==='alt'?M.alt:M.lead,sus=INST[id].kind==='sus',shift=S.voice==='alt'?M.altShift:0;
    const grid=Math.max(M.grid||1,sus?2:1),list=[];
    for(let s=0;s<8;s+=grid){
      let p=M.density*(s%4===0?1.5:s%2===0?1.1:.55);
      if(S.phrase===0&&s>4)p*=.4; // 句尾放慢
      if(Math.random()>p)continue;
      S.mi+=pick([-2,-1,-1,-1,0,1,1,1,2]);
      const mid=(S.ladder.length-1)/2;
      if(S.mi>mid+3&&Math.random()<.6)S.mi-=2;if(S.mi<mid-3&&Math.random()<.6)S.mi+=2;
      S.mi=Math.max(0,Math.min(S.ladder.length-1,S.mi));
      if(s===0&&Math.random()<.65){ // 重拍靠向和弦音，聽起來安穩
        for(const off of [0,1,-1,2,-2]){const m=S.ladder[S.mi+off];if(m!=null&&S.pcs.includes(m%12)){S.mi+=off;break}}
      }
      list.push([s,S.mi,rnd(.5,.82)*(s===0?1.08:1)]);
    }
    list.forEach(([s,mi,v],i)=>{
      const tt=t+s*beat/2+rnd(0,.022),nx=i+1<list.length?list[i+1][0]:Math.min(8,s+5);
      play1(tt,S.ladder[mi]+shift,v,id,(nx-s)*beat/2*.94);
      if(!sus&&Math.random()<.1&&mi+2<S.ladder.length)play1(tt+.012,S.ladder[mi+2]+shift,v*.5,id,beat,false);
    });
  }else{
    S.rest--;
    if(Math.random()<M.arp){ // 休息的小節偶爾彈一串分散和弦
      const ns=S.padNotes.map(m=>m+12),up=Math.random()<.7;
      const seq=up?ns:[...ns].reverse(),start=pick([0,0,2]);
      seq.forEach((m,i)=>{const s=start+i*(M.arpInst==='kalimba'?1:2);if(s<8)play1(t+s*beat/2+rnd(0,.02),m,rnd(.35,.5),M.arpInst,beat)});
    }
  }
  if(Math.random()<M.spark){ // 高處一顆微光
    const m=S.ladder[S.ladder.length-1-Math.floor(Math.random()*3)]+12;
    note(t+pick([1,2,3])*beat+rnd(0,.03),Math.min(m,96),.28,'bell');
  }
  S.bar++;
  return bar;
}
function tick(){
  if(!S.playing||!ctx||ctx.state!=='running')return;
  const now=ctx.currentTime;
  if(S.nextBar<now)S.nextBar=now+.12;
  const ahead=document.hidden?8:1.5; // 在背景時瀏覽器的計時器會變慢，所以多排幾秒
  while(S.nextBar<now+ahead)S.nextBar+=scheduleBar(S.nextBar);
}

/* ========= 播放控制 ========= */
let pauseTok=0,breathT0=0;
async function play(){
  if(!ctx){initAudio();applyMood(S.mood);S.nextBar=ctx.currentTime+.25}
  pauseTok++;
  route(); // 要在按下的當下啟動播放器，否則手機會擋
  try{await ctx.resume()}catch(e){}
  S.playing=true;breathT0=performance.now();mediaInfo();
  ramp(A.fade.gain,1,S.bar===0?3.5:1.8);
  tick();renderOrb();requestAnimationFrame(frame);
}
function pause(fadeSec){
  if(!S.playing)return;
  S.playing=false;const tok=++pauseTok,f=fadeSec||.9;
  ramp(A.fade.gain,0,f);
  setTimeout(()=>{if(tok===pauseTok&&!S.playing){ctx.suspend();if(bgEl)bgEl.pause();mediaInfo()}},f*1000+80);
  S.timerEnd=0;renderOrb();renderChips();
}
setInterval(tick,200);
document.addEventListener('visibilitychange',()=>{
  setLite(MOBILE&&document.hidden);
  if(document.hidden){tick();return} // 進背景前先把後面的音樂排好
  if(S.playing&&ctx&&ctx.state!=='running')ctx.resume().then(tick,()=>{});
  if(S.playing&&bgOn&&bgEl&&bgEl.paused)bgEl.play().catch(()=>{});
});
setInterval(()=>{ // 定時停止
  if(!S.timerEnd||!S.playing)return;
  const left=S.timerEnd-Date.now();
  if(left<=0){$('hint').textContent='晚安，音樂已經慢慢停下';pause(20)}
  else renderTimer(left);
},1000);

/* ========= 畫面 ========= */
const $=id=>document.getElementById(id);
function chip(label,pressed,fn){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',pressed?'true':'false');b.onclick=fn;return b}
function renderChips(){
  const m=$('moods');m.replaceChildren(...MOOD_ORDER.map(id=>chip(MOODS[id].name,S.sel===id,()=>setMood(id))),chip('隨心輪替',S.sel==='auto',()=>setMood('auto')));
  $('moodNote').textContent=S.sel==='auto'?'每隔幾分鐘，隨著換調自動換一種曲風。':MOODS[S.sel].note;
  $('progs').replaceChildren(chip('自動',S.progSel==='auto',()=>setProg('auto')),...PROG_ORDER.map(id=>chip(PROGS[id].name,S.progSel===id,()=>setProg(id))),chip('自由漫遊',S.progSel==='free',()=>setProg('free')));
  $('progNote').textContent=S.progSel==='auto'?'依曲風挑選合適的經典進行，偶爾穿插自由漫遊。':S.progSel==='free'?'不照固定順序，每個和弦都隨機決定下一步。':PROGS[S.progSel].seq.map(d=>ROMAN[d]).join(' – ')+'　'+PROGS[S.progSel].note;
  $('natures').replaceChildren(...Object.keys(NATURES).map(id=>chip(NATURES[id],S.nature===id,()=>setNature(id))));
  renderTimer(S.timerEnd?S.timerEnd-Date.now():0);
  $('breath').setAttribute('aria-pressed',S.breath?'true':'false');
}
let timerSel=0;
function renderTimer(left){
  if(!S.timerEnd)timerSel=0;
  $('timers').replaceChildren(...TIMERS.map(min=>{
    let label=min?min+' 分鐘':'不停止';
    if(min&&min===timerSel&&S.timerEnd){const s=Math.max(0,Math.ceil(left/1000));label='剩 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
    return chip(label,min===timerSel,()=>{timerSel=min;S.timerEnd=min?Date.now()+min*60000:0;renderTimer(min*60000);if(min&&!S.playing)play()});
  }));
}
function setProg(id){S.progSel=id;S.progDirty=true;renderChips();save()} // 下一個和弦起生效
function setMood(id){
  S.sel=id;
  const target=id==='auto'?S.mood:id;
  if(ctx&&target!==S.mood)S.pending=target;else if(!ctx)S.mood=target;
  renderChips();save();
}
function renderOrb(){
  $('orbText').textContent=S.playing?'暫停':(ctx?'繼續':'開始');
  $('orb').setAttribute('aria-label',S.playing?'暫停播放':'開始播放');
  if(!S.playing){$('orb').style.setProperty('--s',1);if(ctx&&$('hint').textContent.indexOf('晚安')<0)$('hint').textContent='已暫停';}
}
$('orb').onclick=()=>S.playing?pause():play();
$('bg').onclick=()=>{S.bg=!S.bg;save();if(A&&S.playing)route();else renderBg()};
$('breath').onclick=()=>{S.breath=!S.breath;breathT0=performance.now();renderChips();save()};
$('vol').value=Math.round(S.vol*100);$('volOut').textContent=Math.round(S.vol*100);
$('vol').oninput=e=>{S.vol=e.target.value/100;$('volOut').textContent=e.target.value;if(A)A.vol.gain.setTargetAtTime(volGain(),ctx.currentTime,.05);save()};
$('natVol').value=Math.round(S.natVol*100);$('natVolOut').textContent=Math.round(S.natVol*100);
$('natVol').oninput=e=>{S.natVol=e.target.value/100;$('natVolOut').textContent=e.target.value;if(A)A.natVol.gain.setTargetAtTime(natGain(),ctx.currentTime,.05);save()};
renderChips();renderBg();

// 漣漪
const cv=$('ripples'),c2=cv.getContext('2d');let rip=[],colors={a:'#888',g:'#888'},colorAt=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function sizeCanvas(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c2.setTransform(d,0,0,d,0,0)}
addEventListener('resize',sizeCanvas);sizeCanvas();
function frame(ts){
  const W=cv.clientWidth,H=cv.clientHeight;
  if(ts-colorAt>1500){const cs=getComputedStyle(document.documentElement);colors={a:cs.getPropertyValue('--accent').trim(),g:cs.getPropertyValue('--glow').trim()};colorAt=ts}
  if(ctx){
    const now=ctx.currentTime-(ctx.baseLatency||0)-(ctx.outputLatency||0); // 扣掉緩衝延遲，漣漪才會對上聽到的聲音
    for(let i=events.length-1;i>=0;i--){const e=events[i];if(e.t>now)continue;events.splice(i,1);
      if(now-e.t>1)continue;
      if(e.kind==='info')$('meta').textContent=e.text;
      else rip.push({x:W*(.08+.84*Math.min(1,Math.max(0,(e.midi-52)/44)))+rnd(-8,8),y:H*rnd(.12,.88),born:ts,v:e.vel,warm:Math.random()<.3});
    }
  }
  c2.clearRect(0,0,W,H);
  rip=rip.filter(r=>ts-r.born<4200);
  for(const r of rip){const k=(ts-r.born)/4200;
    c2.globalAlpha=(1-k)*(1-k)*.55*r.v;c2.strokeStyle=c2.fillStyle=r.warm?colors.g:colors.a;
    if(reduce.matches){c2.beginPath();c2.arc(r.x,r.y,5,0,7);c2.fill()}
    else{c2.lineWidth=1.5;c2.beginPath();c2.arc(r.x,r.y,4+k*58,0,7);c2.stroke();c2.globalAlpha*=.8;c2.beginPath();c2.arc(r.x,r.y,2.5,0,7);c2.fill()}
  }
  c2.globalAlpha=1;
  if(S.playing){
    if(S.breath){ // 10 秒一循環：吸 4 秒、吐 6 秒
      const p=((ts-breathT0)/1000)%10,inh=p<4;
      const x=inh?p/4:1-(p-4)/6,e=.5-.5*Math.cos(Math.PI*x);
      $('orb').style.setProperty('--s',(.84+.22*e).toFixed(4));
      const txt=inh?'吸氣……':'慢慢吐氣……';if($('hint').textContent!==txt)$('hint').textContent=txt;
    }else{$('orb').style.setProperty('--s',1);if($('hint').textContent!=='播放中')$('hint').textContent='播放中'}
  }
  if(S.playing||rip.length)requestAnimationFrame(frame);
}
</script>
