<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面行事曆工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            gap: 10px;
            flex-wrap: wrap;
        }

        .calendar-controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .calendar-controls button:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .current-month {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .calendar-main {
            padding: 10px 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            padding: 6px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .day-cell {
            min-height: 60px;
            padding: 4px;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            position: relative;
        }

        .day-cell:hover {
            border-color: #667eea;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .day-cell.other-month {
            opacity: 0.3;
            background: #f8f9fa;
        }

        .day-cell.today {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            border-color: #ff9800;
            font-weight: bold;
        }

        .day-number {
            font-size: 0.95em;
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
        }

        .day-cell.today .day-number {
            color: #ff9800;
        }

        .event-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin: 2px;
        }

        .event-item {
            font-size: 0.65em;
            padding: 2px 4px;
            margin: 1px 0;
            border-radius: 3px;
            background: #e3f2fd;
            color: #1976d2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-item:hover {
            background: #bbdefb;
        }

        .event-item.work { background: #e3f2fd; color: #1976d2; }
        .event-item.personal { background: #f3e5f5; color: #7b1fa2; }
        .event-item.important { background: #ffebee; color: #c62828; }
        .event-item.meeting { background: #e8f5e9; color: #2e7d32; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .events-sidebar {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .events-sidebar h3 {
            margin-bottom: 8px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 6px;
            font-size: 1em;
        }

        .event-list-item {
            background: white;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-list-item:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .event-list-item.work { border-left-color: #1976d2; }
        .event-list-item.personal { border-left-color: #7b1fa2; }
        .event-list-item.important { border-left-color: #c62828; }
        .event-list-item.meeting { border-left-color: #2e7d32; }

        .event-date {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 2px;
        }

        .event-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
            font-size: 0.9em;
        }

        .event-description {
            font-size: 0.75em;
            color: #666;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #333;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333;
        }

        .color-option.work { background: #1976d2; }
        .color-option.personal { background: #7b1fa2; }
        .color-option.important { background: #c62828; }
        .color-option.meeting { background: #2e7d32; }

        .export-import-section {
            display: flex;
            gap: 8px;
        }

        .export-import-section button {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .export-import-section button:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        #importFile {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                height: calc(100vh - 10px);
            }

            .calendar-grid {
                gap: 2px;
            }

            .day-cell {
                min-height: 50px;
                padding: 3px;
            }

            .day-number {
                font-size: 0.8em;
            }

            .event-item {
                font-size: 0.6em;
                padding: 1px 3px;
            }

            .header h1 {
                font-size: 1.3em;
                padding: 8px;
            }

            .calendar-controls {
                flex-direction: column;
                gap: 5px;
                padding: 5px 10px;
            }

            .button-group {
                width: 100%;
                justify-content: space-between;
            }

            .calendar-controls button {
                font-size: 0.75em;
                padding: 5px 10px;
            }

            .current-month {
                font-size: 0.95em;
            }

            .modal-content {
                padding: 15px;
            }

            .calendar-main {
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 桌面行事曆</h1>
        </div>

        <div class="calendar-controls">
            <div class="button-group">
                <button onclick="previousMonth()">◀ 上月</button>
                <div class="current-month" id="currentMonth"></div>
                <button onclick="nextMonth()">下月 ▶</button>
            </div>
            <div class="button-group">
                <button onclick="today()">今天</button>
                <button onclick="exportEvents()">匯出</button>
                <button onclick="document.getElementById('importFile').click()">匯入</button>
                <button onclick="clearAllEvents()">清除</button>
                <input type="file" id="importFile" accept=".json" onchange="importEvents(event)">
            </div>
        </div>

        <div class="calendar-main">
            <div class="calendar-grid" id="calendarGrid"></div>

            <div class="events-sidebar">
                <h3>📋 近期事件</h3>
                <div id="upcomingEvents"></div>
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">新增事件</div>
            <div class="form-group">
                <label for="eventTitle">事件標題 *</label>
                <input type="text" id="eventTitle" placeholder="輸入事件標題" required>
            </div>
            <div class="form-group">
                <label for="eventDate">日期 *</label>
                <input type="date" id="eventDate" required>
            </div>
            <div class="form-group">
                <label for="eventTime">時間</label>
                <input type="time" id="eventTime">
            </div>
            <div class="form-group">
                <label for="eventDescription">描述</label>
                <textarea id="eventDescription" placeholder="輸入事件描述"></textarea>
            </div>
            <div class="form-group">
                <label>類別</label>
                <div class="color-picker">
                    <div class="color-option work selected" data-category="work" onclick="selectCategory('work')" title="工作"></div>
                    <div class="color-option personal" data-category="personal" onclick="selectCategory('personal')" title="個人"></div>
                    <div class="color-option important" data-category="important" onclick="selectCategory('important')" title="重要"></div>
                    <div class="color-option meeting" data-category="meeting" onclick="selectCategory('meeting')" title="會議"></div>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-danger" id="deleteBtn" onclick="deleteEvent()" style="display: none;">刪除</button>
                <button class="btn-primary" onclick="saveEvent()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('calendarEvents')) || [];
        let currentEventId = null;
        let selectedCategory = 'work';

        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
        const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月',
                           '七月', '八月', '九月', '十月', '十一月', '十二月'];

        function init() {
            renderCalendar();
            renderUpcomingEvents();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('currentMonth').textContent =
                `${year} 年 ${monthNames[month]}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0);

            const firstDayOfWeek = firstDay.getDay();
            const lastDate = lastDay.getDate();
            const prevLastDate = prevLastDay.getDate();

            let calendarHTML = '';

            // Day headers
            dayNames.forEach(day => {
                calendarHTML += `<div class="day-header">${day}</div>`;
            });

            // Previous month days
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                const day = prevLastDate - i;
                calendarHTML += `<div class="day-cell other-month">
                    <div class="day-number">${day}</div>
                </div>`;
            }

            // Current month days
            const today = new Date();
            for (let day = 1; day <= lastDate; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = year === today.getFullYear() &&
                               month === today.getMonth() &&
                               day === today.getDate();

                const dayEvents = events.filter(e => e.date === dateStr);

                let eventsHTML = '';
                dayEvents.slice(0, 3).forEach(event => {
                    const timeStr = event.time ? ` ${event.time}` : '';
                    eventsHTML += `<div class="event-item ${event.category}"
                                       onclick="editEvent('${event.id}')">${event.title}${timeStr}</div>`;
                });

                if (dayEvents.length > 3) {
                    eventsHTML += `<div class="event-item">+${dayEvents.length - 3} 更多</div>`;
                }

                calendarHTML += `<div class="day-cell ${isToday ? 'today' : ''}"
                                     onclick="openModal('${dateStr}')">
                    <div class="day-number">${day}</div>
                    ${eventsHTML}
                </div>`;
            }

            // Next month days
            const remainingCells = 42 - (firstDayOfWeek + lastDate);
            for (let day = 1; day <= remainingCells; day++) {
                calendarHTML += `<div class="day-cell other-month">
                    <div class="day-number">${day}</div>
                </div>`;
            }

            document.getElementById('calendarGrid').innerHTML = calendarHTML;
        }

        function renderUpcomingEvents() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const upcoming = events
                .filter(e => new Date(e.date) >= today)
                .sort((a, b) => {
                    const dateCompare = new Date(a.date) - new Date(b.date);
                    if (dateCompare !== 0) return dateCompare;
                    return (a.time || '').localeCompare(b.time || '');
                })
                .slice(0, 5);

            let html = '';
            if (upcoming.length === 0) {
                html = '<p style="color: #666; text-align: center;">暫無近期事件</p>';
            } else {
                upcoming.forEach(event => {
                    const date = new Date(event.date);
                    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
                    const timeStr = event.time ? ` ${event.time}` : '';

                    html += `<div class="event-list-item ${event.category}"
                                 onclick="editEvent('${event.id}')">
                        <div class="event-date">${dateStr}${timeStr}</div>
                        <div class="event-title">${event.title}</div>
                        ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
                    </div>`;
                });
            }

            document.getElementById('upcomingEvents').innerHTML = html;
        }

        function openModal(date = null) {
            currentEventId = null;
            document.getElementById('modalTitle').textContent = '新增事件';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('deleteBtn').style.display = 'none';

            if (date) {
                document.getElementById('eventDate').value = date;
            } else {
                document.getElementById('eventDate').value =
                    new Date().toISOString().split('T')[0];
            }

            selectCategory('work');
            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        function selectCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.color-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`.color-option[data-category="${category}"]`)
                .classList.add('selected');
        }

        function saveEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const description = document.getElementById('eventDescription').value.trim();

            if (!title || !date) {
                alert('請填寫事件標題和日期！');
                return;
            }

            const event = {
                id: currentEventId || Date.now().toString(),
                title,
                date,
                time,
                description,
                category: selectedCategory
            };

            if (currentEventId) {
                const index = events.findIndex(e => e.id === currentEventId);
                events[index] = event;
            } else {
                events.push(event);
            }

            localStorage.setItem('calendarEvents', JSON.stringify(events));
            closeModal();
            renderCalendar();
            renderUpcomingEvents();
        }

        function editEvent(id) {
            event.stopPropagation?.();
            const eventData = events.find(e => e.id === id);
            if (!eventData) return;

            currentEventId = id;
            document.getElementById('modalTitle').textContent = '編輯事件';
            document.getElementById('eventTitle').value = eventData.title;
            document.getElementById('eventDate').value = eventData.date;
            document.getElementById('eventTime').value = eventData.time || '';
            document.getElementById('eventDescription').value = eventData.description || '';
            document.getElementById('deleteBtn').style.display = 'block';

            selectCategory(eventData.category);
            document.getElementById('eventModal').classList.add('active');
        }

        function deleteEvent() {
            if (!currentEventId) return;

            if (confirm('確定要刪除此事件嗎？')) {
                events = events.filter(e => e.id !== currentEventId);
                localStorage.setItem('calendarEvents', JSON.stringify(events));
                closeModal();
                renderCalendar();
                renderUpcomingEvents();
            }
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function today() {
            currentDate = new Date();
            renderCalendar();
        }

        function exportEvents() {
            const dataStr = JSON.stringify(events, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `calendar-events-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importEvents(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedEvents = JSON.parse(e.target.result);
                    if (Array.isArray(importedEvents)) {
                        if (confirm('匯入事件將會覆蓋現有事件，確定要繼續嗎？')) {
                            events = importedEvents;
                            localStorage.setItem('calendarEvents', JSON.stringify(events));
                            renderCalendar();
                            renderUpcomingEvents();
                            alert('事件匯入成功！');
                        }
                    } else {
                        alert('無效的事件文件格式！');
                    }
                } catch (err) {
                    alert('讀取文件時發生錯誤！');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function clearAllEvents() {
            if (confirm('確定要清除所有事件嗎？此操作無法撤銷！')) {
                events = [];
                localStorage.setItem('calendarEvents', JSON.stringify(events));
                renderCalendar();
                renderUpcomingEvents();
            }
        }

        // Close modal when clicking outside
        document.getElementById('eventModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
